<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 点云加载器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: white;
            z-index: 100;
            backdrop-filter: blur(10px);
            min-width: 300px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
        }

        .control-group button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            margin: 5px 0;
            transition: background 0.3s;
        }

        .control-group button:hover {
            background: #45a049;
        }

        .file-upload {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s;
        }

        .file-upload:hover {
            border-color: #4CAF50;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload label {
            cursor: pointer;
            color: #4CAF50;
            font-weight: bold;
        }

        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
        }

        .progress {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="info">
            <h2>Three.js 点云加载器</h2>
            <p>支持 PLY 格式点云文件</p>
            <p>使用鼠标拖拽旋转视角</p>
            <p>滚轮缩放，右键平移</p>
        </div>

        <div id="controls">
            <div class="control-group">
                <label>文件上传:</label>
                <div class="file-upload">
                    <input type="file" id="fileInput" accept=".ply,.txt,.xyz">
                    <label for="fileInput">选择点云文件 (PLY/TXT/XYZ)</label>
                </div>
                <div class="progress" id="progress" style="display: none;">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="control-group">
                <label for="pointSize">点的大小:</label>
                <input type="range" id="pointSize" min="0.5" max="10" value="2" step="0.5">
                <span id="pointSizeValue">2</span>
            </div>

            <div class="control-group">
                <label for="colorMode">颜色模式:</label>
                <select id="colorMode">
                    <option value="height">高度色</option>
                    <option value="distance">距离色</option>
                    <option value="intensity">强度色</option>
                    <option value="uniform">统一色</option>
                </select>
            </div>

            <div class="control-group">
                <button onclick="generateSamplePointCloud()">生成示例点云</button>
                <button onclick="resetCamera()">重置视角</button>
                <button onclick="exportPointCloud()">导出点云</button>
            </div>

            <div class="control-group">
                <label>示例数据:</label>
                <button onclick="loadSampleSphere()">球形示例</button>
                <button onclick="loadSampleCube()">立方体示例</button>
                <button onclick="loadSampleSpiral()">螺旋示例</button>
            </div>
        </div>

        <div id="stats">
            <div>FPS: <span id="fps">0</span></div>
            <div>点数: <span id="pointCountDisplay">0</span></div>
            <div>文件: <span id="fileNameDisplay">无</span></div>
        </div>

        <div class="loading" id="loading">正在加载点云...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/stats.min.js"></script>

    <script>
        // 全局变量
        let scene, camera, renderer, controls, stats;
        let pointCloud, pointCloudGeometry, pointCloudMaterial;
        let currentPointData = [];

        // 初始化Three.js场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('container').appendChild(renderer.domElement);

            // 创建控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 创建统计信息
            stats = new Stats();
            stats.dom.style.position = 'absolute';
            stats.dom.style.top = '0px';
            stats.dom.style.left = '0px';
            document.getElementById('container').appendChild(stats.dom);

            // 添加光源
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            // 生成示例点云
            generateSamplePointCloud();

            // 开始渲染循环
            animate();

            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);

            // 文件上传事件
            document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        }

        // 处理文件上传
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                parsePointCloudFile(content, file.name);
            };
            reader.readAsText(file);
        }

        // 解析点云文件
        function parsePointCloudFile(content, fileName) {
            const loading = document.getElementById('loading');
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            
            loading.style.display = 'block';
            progress.style.display = 'block';

            const lines = content.split('\n');
            const points = [];
            let vertexCount = 0;
            let hasColors = false;
            let hasNormals = false;
            let headerEnded = false;

            // 解析PLY文件头
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('element vertex')) {
                    vertexCount = parseInt(line.split(' ')[2]);
                } else if (line.includes('property') && line.includes('red')) {
                    hasColors = true;
                } else if (line.includes('property') && line.includes('nx')) {
                    hasNormals = true;
                } else if (line === 'end_header') {
                    headerEnded = true;
                    break;
                }
            }

            // 解析点数据
            let dataStartIndex = lines.findIndex(line => line.trim() === 'end_header') + 1;
            
            for (let i = dataStartIndex; i < lines.length && points.length < vertexCount; i++) {
                const line = lines[i].trim();
                if (line === '') continue;

                const values = line.split(/\s+/);
                if (values.length < 3) continue;

                const x = parseFloat(values[0]);
                const y = parseFloat(values[1]);
                const z = parseFloat(values[2]);

                if (isNaN(x) || isNaN(y) || isNaN(z)) continue;

                const point = { x, y, z };

                // 解析颜色（如果有）
                if (hasColors && values.length >= 6) {
                    point.r = parseInt(values[3]) / 255;
                    point.g = parseInt(values[4]) / 255;
                    point.b = parseInt(values[5]) / 255;
                }

                // 解析法向量（如果有）
                if (hasNormals && values.length >= 9) {
                    point.nx = parseFloat(values[6]);
                    point.ny = parseFloat(values[7]);
                    point.nz = parseFloat(values[8]);
                }

                points.push(point);

                // 更新进度
                if (i % 1000 === 0) {
                    const progressPercent = ((i - dataStartIndex) / (lines.length - dataStartIndex)) * 100;
                    progressBar.style.width = progressPercent + '%';
                }
            }

            currentPointData = points;
            createPointCloud(points);
            
            document.getElementById('fileNameDisplay').textContent = fileName;
            loading.style.display = 'none';
            progress.style.display = 'none';
        }

        // 创建点云
        function createPointCloud(points) {
            // 移除现有的点云
            if (pointCloud) {
                scene.remove(pointCloud);
                pointCloudGeometry.dispose();
                pointCloudMaterial.dispose();
            }

            const pointSize = parseFloat(document.getElementById('pointSize').value);
            const colorMode = document.getElementById('colorMode').value;

            // 创建几何体
            pointCloudGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(points.length * 3);
            const colors = new Float32Array(points.length * 3);

            // 计算边界框
            let minX = Infinity, minY = Infinity, minZ = Infinity;
            let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

            for (let i = 0; i < points.length; i++) {
                const point = points[i];
                positions[i * 3] = point.x;
                positions[i * 3 + 1] = point.y;
                positions[i * 3 + 2] = point.z;

                minX = Math.min(minX, point.x);
                minY = Math.min(minY, point.y);
                minZ = Math.min(minZ, point.z);
                maxX = Math.max(maxX, point.x);
                maxY = Math.max(maxY, point.y);
                maxZ = Math.max(maxZ, point.z);

                setPointColor(colors, i, point, colorMode);
            }

            pointCloudGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            pointCloudGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // 创建材质
            pointCloudMaterial = new THREE.PointsMaterial({
                size: pointSize,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            // 创建点云
            pointCloud = new THREE.Points(pointCloudGeometry, pointCloudMaterial);
            scene.add(pointCloud);

            // 调整相机位置以适应点云
            const center = new THREE.Vector3(
                (minX + maxX) / 2,
                (minY + maxY) / 2,
                (minZ + maxZ) / 2
            );
            const size = Math.max(maxX - minX, maxY - minY, maxZ - minZ);
            
            camera.position.copy(center);
            camera.position.z += size * 2;
            controls.target.copy(center);
            controls.update();

            // 更新统计信息
            document.getElementById('pointCountDisplay').textContent = points.length;
        }

        // 设置点颜色
        function setPointColor(colors, index, point, colorMode) {
            let r, g, b;

            switch (colorMode) {
                case 'height':
                    const height = (point.y + 50) / 100;
                    r = Math.max(0, Math.min(1, height));
                    g = Math.max(0, Math.min(1, 1 - height));
                    b = 0.5;
                    break;
                case 'distance':
                    const distance = Math.sqrt(point.x * point.x + point.y * point.y + point.z * point.z) / 100;
                    r = Math.min(distance, 1);
                    g = Math.max(0, 1 - distance);
                    b = 0.5;
                    break;
                case 'intensity':
                    if (point.r !== undefined) {
                        r = point.r;
                        g = point.g;
                        b = point.b;
                    } else {
                        r = g = b = 0.8;
                    }
                    break;
                case 'uniform':
                default:
                    r = g = b = 0.8;
                    break;
            }

            colors[index * 3] = r;
            colors[index * 3 + 1] = g;
            colors[index * 3 + 2] = b;
        }

        // 生成示例点云
        function generateSamplePointCloud() {
            const points = [];
            for (let i = 0; i < 5000; i++) {
                const x = (Math.random() - 0.5) * 100;
                const y = (Math.random() - 0.5) * 100;
                const z = (Math.random() - 0.5) * 100;
                points.push({ x, y, z });
            }
            currentPointData = points;
            createPointCloud(points);
            document.getElementById('fileNameDisplay').textContent = '示例数据';
        }

        // 加载球形示例
        function loadSampleSphere() {
            const points = [];
            for (let i = 0; i < 10000; i++) {
                const phi = Math.acos(-1 + (2 * i) / 10000);
                const theta = Math.sqrt(10000 * Math.PI) * phi;
                const radius = 30;

                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(phi);
                points.push({ x, y, z });
            }
            currentPointData = points;
            createPointCloud(points);
            document.getElementById('fileNameDisplay').textContent = '球形示例';
        }

        // 加载立方体示例
        function loadSampleCube() {
            const points = [];
            for (let i = 0; i < 8000; i++) {
                const x = (Math.random() - 0.5) * 60;
                const y = (Math.random() - 0.5) * 60;
                const z = (Math.random() - 0.5) * 60;
                points.push({ x, y, z });
            }
            currentPointData = points;
            createPointCloud(points);
            document.getElementById('fileNameDisplay').textContent = '立方体示例';
        }

        // 加载螺旋示例
        function loadSampleSpiral() {
            const points = [];
            for (let i = 0; i < 10000; i++) {
                const t = (i / 10000) * 4 * Math.PI;
                const radius = 20 + (i / 10000) * 10;
                const x = radius * Math.cos(t);
                const y = radius * Math.sin(t);
                const z = (i / 10000) * 40 - 20;
                points.push({ x, y, z });
            }
            currentPointData = points;
            createPointCloud(points);
            document.getElementById('fileNameDisplay').textContent = '螺旋示例';
        }

        // 导出点云
        function exportPointCloud() {
            if (currentPointData.length === 0) {
                alert('没有点云数据可导出');
                return;
            }

            let content = 'ply\n';
            content += 'format ascii 1.0\n';
            content += 'element vertex ' + currentPointData.length + '\n';
            content += 'property float x\n';
            content += 'property float y\n';
            content += 'property float z\n';
            content += 'property uchar red\n';
            content += 'property uchar green\n';
            content += 'property uchar blue\n';
            content += 'end_header\n';

            for (const point of currentPointData) {
                const r = Math.round((point.r || 0.8) * 255);
                const g = Math.round((point.g || 0.8) * 255);
                const b = Math.round((point.b || 0.8) * 255);
                content += `${point.x} ${point.y} ${point.z} ${r} ${g} ${b}\n`;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'pointcloud.ply';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 重置相机
        function resetCamera() {
            camera.position.set(0, 0, 50);
            controls.reset();
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            renderer.render(scene, camera);
            stats.update();

            // 更新FPS显示
            document.getElementById('fps').textContent = Math.round(stats.getFPS());
        }

        // 事件监听器
        document.getElementById('pointSize').addEventListener('input', function() {
            document.getElementById('pointSizeValue').textContent = this.value;
            if (pointCloudMaterial) {
                pointCloudMaterial.size = parseFloat(this.value);
            }
        });

        document.getElementById('colorMode').addEventListener('change', function() {
            if (currentPointData.length > 0) {
                createPointCloud(currentPointData);
            }
        });

        // 初始化应用
        init();
    </script>
</body>
</html>
